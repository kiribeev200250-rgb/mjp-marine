name: Tests

on:
  push:
  pull_request:

jobs:
  money-cascades:
    runs-on: ubuntu-latest

    # Эфемерный Postgres, не продакшен-Supabase — тесты денежных каскадов не
    # должны иметь возможность коснуться реальных данных, даже случайно.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mjptest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/mjptest
      DIRECT_URL: postgresql://test:test@localhost:5432/mjptest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Push schema to the ephemeral test database
        run: npx prisma db push --skip-generate

      - name: Run tests
        run: npm test
